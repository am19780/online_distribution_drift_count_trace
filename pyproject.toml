[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "am19780-online_distribution_drift_count_trace"
version = "0.1.0"
description = "统计各来源片段的贡献量与占比，标出LoRA 与参数高效微调研究员·线上分布漂移的检测上最主要的来源"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "am19780" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://am19780.github.io"
Repository = "https://github.com/am19780/online_distribution_drift_count_trace"
Issues = "https://github.com/am19780/online_distribution_drift_count_trace/issues"

[project.scripts]
online_distribution_drift_count_trace = "online_distribution_drift_count_trace:main"

[tool.setuptools]
py-modules = ["online_distribution_drift_count_trace"]
